name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: robotops, POSTGRES_PASSWORD: pw, POSTGRES_DB: robotops_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U robotops" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql+psycopg://robotops:pw@localhost:5432/robotops_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements.txt
      - run: cd backend && ruff check app tests ../agent ../scripts && ruff format --check app tests ../agent ../scripts
      - name: Migrations apply and match the models
        run: cd backend && DATABASE_URL=$TEST_DATABASE_URL alembic upgrade head && DATABASE_URL=$TEST_DATABASE_URL alembic check
      - run: cd backend && python -m pytest -q
      - name: Device agent unit tests
        run: cd agent && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: cd frontend && npm ci && npm run build && npm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: pip install -r backend/requirements.txt
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium && npx playwright test
  compose:
    # Builds the production images, starts the full stack (API, 3 workers, nginx, Postgres, Redis),
    # runs the browser tests through nginx and the multi-worker check, then tears down.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Create .env with random secrets
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
      - run: docker compose build
      - run: docker compose up -d --scale worker=3 --wait --wait-timeout 180
      - run: curl -fsS http://localhost:8080/healthz
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium && E2E_BASE_URL=http://localhost:8080 npx playwright test
      - run: python3 scripts/worker_chaos.py --url http://localhost:8080
      - if: failure()
        run: docker compose logs --no-color | tail -300
      - if: always()
        run: docker compose down -v
