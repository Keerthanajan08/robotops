server {
  listen 80;
  client_max_body_size 1m;

  # Re-resolve the api service through Docker's DNS instead of caching its IP at startup.
  # Without this, redeploying the api container (new IP) makes every /api request fail with 502
  # until nginx itself is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/ { proxy_pass $api_upstream; }
  location /healthz { proxy_pass $api_upstream; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
